<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRCT Mining Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MRCT Mining Dashboard</h1>
        <div class="menu-list">
            <button class="menu-btn" onclick="openTab('Profile')">👤 Profile</button>
            <button class="menu-btn" onclick="openTab('Mine')">⛏️ Mine</button>
            <button class="menu-btn" onclick="openTab('Task')">📋 Task</button>
            <button class="menu-btn" onclick="openTab('Friend')">👥 Friend</button>
            <button class="menu-btn" onclick="openTab('Wallet')">💰 Wallet</button>
        </div>
    </div>

    <script>
        // Telegram Web App Initialization
        const tg = window.Telegram.WebApp;
        tg.expand();

        function openTab(tabName) {
            alert(tabName + " မျက်နှာပြင်သို့ ရောက်ရှိပါပြီ။");
            // ဤနေရာတွင် Tab တစ်ခုချင်းစီအတွက် လုပ်ဆောင်ချက်များကို ဆက်လက်ရေးသားနိုင်ပါသည်
        }
    </script>
</body>
</html>
